name: Native HUD-only render
on:
  workflow_dispatch:
  push:
    branches: [tools/native-hud-offscreen-preview]
  pull_request:
    branches: [feat/bedrock-touch-polish]

concurrency:
  group: hud-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-hud-offscreen-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: horizon-hud-only
      - name: Verify native mobile layout and icon parity
        run: python3 tools/test_touch_layout_geometry.py
      - name: Type-check genuine Rust atlas renderer without game startup
        run: cargo check --no-default-features -p horizon-client --bin hud-offscreen

  render-production-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Validate source extraction and build HUD-only APK
        run: |
          python3 tools/extract_horizon_overlay.py --source packaging/android/java/dev/horizon/android/HorizonActivity.java --output packaging/hud-preview/build/generated/horizon/java/dev/horizon/hudpreview/HudPreviewOverlay.java
          gradle -p packaging/hud-preview assembleDebug --no-daemon --stacktrace
          echo 'Built APK candidates:'
          find . -type f -name '*debug*.apk' -print
          apk=$(find . -type f -name '*debug*.apk' -print -quit)
          test -n "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/horizon-hud-preview-debug.apk
      - name: Capture actual production Canvas quickly with native Skia
        run: |
          gradle -p packaging/hud-preview testDebugUnitTest --tests dev.horizon.hudpreview.HudCaptureTest --no-daemon --stacktrace
          find artifacts/hud-native-skia -maxdepth 1 -type f -name '*.png' -print
      - name: Retain fast HUD-only renders even if emulator fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-hud-native-skia
          path: artifacts/hud-native-skia/*.png
          if-no-files-found: warn
      - name: Render production Canvas on headless Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: |
            set -e
            mkdir -p artifacts
            adb install -r artifacts/horizon-hud-preview-debug.apk
            adb shell wm size 1280x800
            adb shell wm density 240
            adb shell am start -n dev.horizon.hudpreview/.HudPreviewActivity --ei scheme 1 --ei scale 100 --ei opacity 72
            sleep 3
            adb exec-out screencap -p > artifacts/android-hud-joystick-1280x800.png
            adb shell am start -n dev.horizon.hudpreview/.HudPreviewActivity --ei scheme 3 --ei scale 100 --ei opacity 72
            sleep 1
            adb exec-out screencap -p > artifacts/android-hud-dpad-1280x800.png
            file artifacts/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-horizon-hud-captures
          path: |
            artifacts/*.png
            artifacts/*.apk
          if-no-files-found: warn
