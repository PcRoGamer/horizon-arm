name: ARM sync conflict probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'sync/trigger-conflict-probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-10-30
          fetch-depth: 0
      - name: Probe original Android PR replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ARM Sync Probe"
          git config user.email "arm-sync-probe@users.noreply.github.com"
          git remote add upstream https://github.com/horizon-rust/horizon.git || true
          git fetch upstream refs/pull/3676/head:refs/remotes/upstream/android-3676
          base=$(git merge-base HEAD refs/remotes/upstream/android-3676)
          echo "CURRENT=$(git rev-parse HEAD)"
          echo "ANDROID_HEAD=$(git rev-parse refs/remotes/upstream/android-3676)"
          echo "MERGE_BASE=$base"
          mapfile -t commits < <(git rev-list --reverse "$base"..refs/remotes/upstream/android-3676)
          printf 'COMMITS=%s\n' "${#commits[@]}"
          for c in "${commits[@]}"; do
            echo "=== CHERRY-PICK $c $(git show -s --format=%s "$c") ==="
            if ! git cherry-pick "$c"; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if [[ "$c" == 5f145ed3c9ff54f74f83f2b7584dddedda63170b && "$conflicts" == "Cargo.toml" ]]; then
                echo "Resolving workspace split: keep horizon-client-render and add horizon-android"
                git checkout --ours Cargo.toml
                python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          needle = '    "crates/horizon-client-render",\n'
          assert needle in s
          if '    "crates/horizon-android",\n' not in s:
              s = s.replace(needle, needle + '    "crates/horizon-android",\n', 1)
          p.write_text(s)
          PY
                git add Cargo.toml
                GIT_EDITOR=true git cherry-pick --continue
                continue
              fi
              if [[ "$c" == ccfe63095b024246d1f195924c311175beaec265 && "$conflicts" == "crates/horizon-client/src/game.rs" ]]; then
                echo "Resolving event dispatch: keep upstream keymap and Android touch handling"
                python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('crates/horizon-client/src/game.rs')
          s = p.read_text()
          markers = [line for line in s.splitlines() if line.startswith(('<<<<<<< ', '=======', '>>>>>>> '))]
          assert len(markers) == 3, markers
          s = re.sub(r'^(?:<<<<<<< .*|=======|>>>>>>> .*)\n?', '', s, flags=re.M)
          p.write_text(s)
          PY
                git add crates/horizon-client/src/game.rs
                GIT_EDITOR=true git cherry-pick --continue
                continue
              fi
              if [[ "$c" == 25306f558372688b58f2d3256e4e97327d842a6f && "$conflicts" == "crates/horizon-client/src/game.rs" ]]; then
                echo "Resolving cursor capture: keep upstream view_at centering on desktop and no warp on Android"
                python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('crates/horizon-client/src/game.rs')
          s = p.read_text()
          replacement = '''        #[cfg(not(target_os = "android"))]\n        let [vx, vy] = self.view_at.map(f64::from);\n        #[cfg(not(target_os = "android"))]\n        let centre = winit::dpi::PhysicalPosition::new(\n            vx + f64::from(size[0]) / 2.0,\n            vy + f64::from(size[1]) / 2.0,\n        );\n        #[cfg(not(target_os = "android"))]\n'''
          pattern = r'^<<<<<<< HEAD\n.*?^=======\n.*?^>>>>>>> 25306f558 \(client: the phone\'s own controls in the world\)\n'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.M | re.S)
          assert n == 1, f'expected one cursor conflict, got {n}'
          assert '<<<<<<< ' not in s2 and '\n=======\n' not in s2 and '>>>>>>> ' not in s2
          p.write_text(s2)
          PY
                git add crates/horizon-client/src/game.rs
                GIT_EDITOR=true git cherry-pick --continue
                continue
              fi
              echo "=== CONFLICTED FILES ==="
              printf '%s\n' "$conflicts"
              echo "=== STATUS ==="
              git status --short
              echo "=== CONFLICT DIFF ==="
              git diff --cc || true
              exit 23
            fi
          done
          echo "ANDROID_FOUNDATION_REPLAY_OK=$(git rev-parse HEAD)"
