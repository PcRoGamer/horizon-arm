name: ARM sync candidate validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'sync/trigger-conflict-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/candidate-2026-10-30
          fetch-depth: 0

      - name: Validate merged tree
        run: |
          set -euo pipefail
          git diff --check
          cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Set up Java 25 for fact generation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Android toolchain symlink target
        run: mkdir -p ../horizon-android/.toolchain

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip patch

      - name: Fetch Android toolchain
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-port/.toolchain/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-port/.toolchain/android-sdk
        run: android-port/tools/fetch-toolchain.sh

      - name: Fetch Rust dependencies
        run: cargo fetch

      - name: Fetch pinned Minecraft inputs for CI only
        run: python3 android-port/tools/ci-fetch-minecraft.py

      - name: Compute Horizon 26.3 facts
        run: |
          cargo run --release -p horizon-prepare -- \
            --prepare \
            --minecraft-dir android-port/build/ci-minecraft \
            --server-jar android-port/build/ci-minecraft/server.jar \
            --root .

      - name: Package Horizon-only fact bundle
        run: |
          python3 android-port/tools/ci-pack-facts.py
          unzip -l android-port/build/horizon-facts-26.3.zip | head -80
          if unzip -l android-port/build/horizon-facts-26.3.zip | grep -E '(^|/)(assets|data)/|pack.png|client.jar|server.jar'; then
            echo 'fact bundle contains a Minecraft file' >&2
            exit 1
          fi

      - name: Build self-bootstrapping ARM64 APK
        env:
          HORIZON_NO_ASSETS: '1'
          HORIZON_FACTS_ZIP: ${{ github.workspace }}/android-port/build/horizon-facts-26.3.zip
          HORIZON_JOBS: '4'
        run: android-port/tools/build.sh arm64 fast

      - name: Verify APK
        run: |
          test -f android-port/build/horizon-android-arm64.apk
          ls -lh android-port/build/horizon-android-arm64.apk
          unzip -l android-port/build/horizon-android-arm64.apk | grep 'lib/arm64-v8a/libhorizon_android.so'
          unzip -l android-port/build/horizon-android-arm64.apk | grep 'assets/horizon-facts-26.3.zip'
          sha256sum android-port/build/horizon-android-arm64.apk

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-arm-upstream-sync-candidate-apk
          path: android-port/build/horizon-android-arm64.apk
          if-no-files-found: error
