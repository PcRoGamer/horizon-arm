name: ARM sync latest-upstream replay probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  replay:
    if: github.event.pull_request.head.ref == 'sync/trigger-conflict-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/candidate-2026-10-30
          fetch-depth: 0

      - name: Replay Android delta onto current upstream
        shell: bash
        run: |
          set -euo pipefail
          BASE=b1dfde280b92a8768b0d04eb2265e8fb200bf6de
          CANDIDATE=$(git rev-parse HEAD)
          git config user.name 'ARM sync bot'
          git config user.email 'arm-sync@users.noreply.github.com'
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --no-tags upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          echo "candidate=$CANDIDATE"
          echo "upstream=$UPSTREAM"
          mapfile -t COMMITS < <(git rev-list --reverse "$BASE..$CANDIDATE")
          echo "android_delta_commits=${#COMMITS[@]}"
          git checkout -B sync/replay-latest "$UPSTREAM"

          resolve_known_conflict() {
            local c="$1"
            case "$c" in
              9a9687b38ccb4773869329a2dd3023b4dbfba5a9)
                mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
                if [[ "${#unresolved[@]}" -eq 1 && "${unresolved[0]}" == "crates/horizon-client/src/main.rs" ]]; then
                  echo "Resolving client library move against modern startup/error handling"
                  git checkout --ours -- crates/horizon-client/src/main.rs
                  sed -i '/^mod game;$/d; s/game::run()/horizon_client::game::run()/g; s/game::UsageError/horizon_client::game::UsageError/g; s/game::exit_code::/horizon_client::game::exit_code::/g' crates/horizon-client/src/main.rs
                  git add crates/horizon-client/src/main.rs crates/horizon-client/src/lib.rs
                  GIT_EDITOR=true git cherry-pick --continue
                  return 0
                fi
                ;;
              0b3f994e9ad3d3d235ec48e491c420e0a03e994c)
                mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
                if [[ "${#unresolved[@]}" -eq 1 && "${unresolved[0]}" == "crates/horizon-client/src/game.rs" ]]; then
                  echo "Resolving Android activity startup against modern Options::read/parse"
                  git checkout --ours -- crates/horizon-client/src/game.rs
                  python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/horizon-client/src/game.rs')
          s = p.read_text()
          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing modern Android replay anchor: {label}')
              s = s.replace(old, new, 1)

          once(
              '''    fn read() -> Result<Option<Self>> {
                  let Some(mut o) = Self::parse(std::env::args().skip(1))
                      .map_err(|e| launch_api::UsageError(e.to_string()))?
          ''',
              '''    fn read() -> Result<Option<Self>> {
                  // Android's process argv belongs to the platform, not Horizon.
                  #[cfg(not(target_os = "android"))]
                  let args = std::env::args().skip(1);
                  #[cfg(target_os = "android")]
                  let args = std::iter::empty::<String>();
                  let Some(mut o) = Self::parse(args)
                      .map_err(|e| launch_api::UsageError(e.to_string()))?
          ''',
              'Options::read argv',
          )
          once(
              '''    fn parse(mut args: impl Iterator<Item = String>) -> Result<Option<Self>> {
                  let sibling = std::env::current_exe()?
                      .parent()
                      .ok_or("missing executable directory")?
                      .join("resources");
          ''',
              '''    fn parse(mut args: impl Iterator<Item = String>) -> Result<Option<Self>> {
                  // NativeActivity is launched through Android's zygote, so its executable
                  // path has no adjacent Horizon resources.
                  #[cfg(not(target_os = "android"))]
                  let sibling = std::env::current_exe()?
                      .parent()
                      .ok_or("missing executable directory")?
                      .join("resources");
                  #[cfg(target_os = "android")]
                  let sibling = PathBuf::new();
          ''',
              'Options::parse sibling resources',
          )
          once(
              '''            resources: if sibling.join("horizon-resources.json").exists() {
                          sibling
                      } else {
                          std::path::Path::new(".local/horizon-client").join(horizon_core::VANILLA_VERSION)
                      },
          ''',
              '''            // Android and launchers without argv can provide the prepared
                      // resource directory explicitly.
                      resources: match std::env::var_os("HORIZON_RESOURCES").filter(|v| !v.is_empty()) {
                          Some(dir) => PathBuf::from(dir),
                          None if sibling.join("horizon-resources.json").exists() => sibling,
                          None => std::path::Path::new(".local/horizon-client")
                              .join(horizon_core::VANILLA_VERSION),
                      },
          ''',
              'resources default',
          )
          once(
              '''            world: None,
          ''',
              '''            world: {
                          #[cfg(target_os = "android")]
                          {
                              std::env::var("HORIZON_WORLD").ok().filter(|w| !w.is_empty())
                          }
                          #[cfg(not(target_os = "android"))]
                          None
                      },
          ''',
              'Android HORIZON_WORLD',
          )
          once(
              '''fn run_event_loop(mut game: Game<'_>) -> Result<()> {
              let result = EventLoop::new()?.run_app(&mut game);
          ''',
              '''/// Build Winit from Android's NativeActivity when the OS owns the process;
          /// desktop platforms continue to create a normal event loop.
          fn event_loop() -> Result<EventLoop<()>> {
              #[cfg(target_os = "android")]
              {
                  use winit::platform::android::EventLoopBuilderExtAndroid;
                  let app = horizon_client::android::app()
                      .ok_or("the Android activity was not handed over (crates/horizon-android)")?;
                  return Ok(EventLoop::builder().with_android_app(app).build()?);
              }
              #[cfg(not(target_os = "android"))]
              Ok(EventLoop::new()?)
          }

          fn run_event_loop(mut game: Game<'_>) -> Result<()> {
              let result = event_loop()?.run_app(&mut game);
          ''',
              'run_event_loop',
          )
          once(
              '''    let result = EventLoop::new()?.run_app(&mut app);
          ''',
              '''    let result = event_loop()?.run_app(&mut app);
          ''',
              'loading event loop',
          )
          p.write_text(s)
          PY
                  git add crates/horizon-client/src/game.rs crates/horizon-client/Cargo.toml crates/horizon-client/src/android.rs
                  GIT_EDITOR=true git cherry-pick --continue
                  return 0
                fi
                ;;
            esac
            return 1
          }

          for c in "${COMMITS[@]}"; do
            echo "=== cherry-pick $c $(git show -s --format=%s "$c")"
            if ! git cherry-pick "$c"; then
              if resolve_known_conflict "$c"; then
                continue
              fi
              echo "::error::conflict while replaying $c"
              git status --short
              echo '--- unmerged paths ---'
              git diff --name-only --diff-filter=U
              echo '--- conflict diff ---'
              git diff --cc || true
              exit 1
            fi
          done
          echo "REPLAY_OK upstream=$UPSTREAM head=$(git rev-parse HEAD) commits=${#COMMITS[@]}"
          # These three legacy Android-port files already contain harmless whitespace
          # defects. Keep the check strict for every other replayed path.
          git diff --check "$UPSTREAM..HEAD" -- . \
            ':(exclude)android-port/winit/winit-0.30.13-android-back.patch' \
            ':(exclude)android-port/winit/winit-0.30.13-android-gamepad.patch' \
            ':(exclude)crates/horizon-android/src/smoke.rs'
          cargo metadata --no-deps --format-version 1 >/dev/null
          git push --force origin HEAD:refs/heads/sync/candidate-latest-2026-10-31
          echo "PERSISTED head=$(git rev-parse HEAD)"
