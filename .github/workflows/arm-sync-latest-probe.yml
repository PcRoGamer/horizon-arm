name: ARM sync latest-upstream replay probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  replay:
    if: github.event.pull_request.head.ref == 'sync/trigger-conflict-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/candidate-2026-10-30
          fetch-depth: 0

      - name: Replay Android delta onto current upstream
        shell: bash
        run: |
          set -euo pipefail
          BASE=b1dfde280b92a8768b0d04eb2265e8fb200bf6de
          CANDIDATE=$(git rev-parse HEAD)
          git config user.name 'ARM sync bot'
          git config user.email 'arm-sync@users.noreply.github.com'
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --no-tags upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          echo "candidate=$CANDIDATE"
          echo "upstream=$UPSTREAM"
          mapfile -t COMMITS < <(git rev-list --reverse "$BASE..$CANDIDATE")
          echo "android_delta_commits=${#COMMITS[@]}"
          git checkout -B sync/replay-latest "$UPSTREAM"

          resolve_known_conflict() {
            local c="$1"
            case "$c" in
              9a9687b38ccb4773869329a2dd3023b4dbfba5a9)
                mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
                if [[ "${#unresolved[@]}" -eq 1 && "${unresolved[0]}" == "crates/horizon-client/src/main.rs" ]]; then
                  echo "Resolving client library move against modern startup/error handling"
                  git checkout --ours -- crates/horizon-client/src/main.rs
                  sed -i '/^mod game;$/d; s/game::run()/horizon_client::game::run()/g; s/game::UsageError/horizon_client::game::UsageError/g; s/game::exit_code::/horizon_client::game::exit_code::/g' crates/horizon-client/src/main.rs
                  git add crates/horizon-client/src/main.rs crates/horizon-client/src/lib.rs
                  GIT_EDITOR=true git cherry-pick --continue
                  return 0
                fi
                ;;
            esac
            return 1
          }

          for c in "${COMMITS[@]}"; do
            echo "=== cherry-pick $c $(git show -s --format=%s "$c")"
            if ! git cherry-pick "$c"; then
              if resolve_known_conflict "$c"; then
                continue
              fi
              echo "::error::conflict while replaying $c"
              git status --short
              echo '--- unmerged paths ---'
              git diff --name-only --diff-filter=U
              echo '--- conflict diff ---'
              git diff --cc || true
              exit 1
            fi
          done
          echo "REPLAY_OK upstream=$UPSTREAM head=$(git rev-parse HEAD) commits=${#COMMITS[@]}"
          git diff --check "$UPSTREAM..HEAD"
          cargo metadata --no-deps --format-version 1 >/dev/null
