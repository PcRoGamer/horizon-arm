name: Android clean port

on:
  push:
    branches: [android-clean-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Offline account tests
        run: cargo test -p horizon-client offline_accounts --lib
      - name: Client check
        run: cargo check -p horizon-client

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - uses: actions/cache@v4
        with:
          path: |
            .local/android/mojang
            .local/horizon-client
            .local/android/engine-data.zip
          key: android-engine-data-${{ hashFiles('research-lock.json', 'crates/horizon-prepare/**', 'tools/android_engine_data.py') }}
      - name: Install JDK 25 for Horizon resource exporters
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Horizon engine data from Mojang-verified inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .local/android/engine-data.zip ]]; then
            python3 tools/android_engine_data.py
          fi
          python3 - <<'PY'
          from zipfile import ZipFile
          path = '.local/android/engine-data.zip'
          with ZipFile(path) as z:
              names = set(z.namelist())
          assert 'horizon-resources.json' in names, 'engine-data.zip lacks Horizon resource marker'
          assert 'asset-index.json' not in names, 'Minecraft asset index must not be bundled'
          assert not any(n.startswith('assets/minecraft/') for n in names), 'Minecraft assets must not be bundled'
          print(f'engine-data.zip: {len(names)} Horizon-generated entries')
          PY
      - name: Install JDK 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$NDK" || ! -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64" ]]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)"
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android28-clang"
          {
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android28-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android28-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android28-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Android compile check
        run: cargo check -p horizon-android --target aarch64-linux-android
      - name: Build native arm64 library
        run: cargo build -p horizon-android --target aarch64-linux-android --profile fast
      - name: Stage native library and Horizon engine data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/android/gradle-jni/arm64-v8a .local/android/gradle-assets
          cp target/aarch64-linux-android/fast/libhorizon_android.so .local/android/gradle-jni/arm64-v8a/
          cp .local/android/engine-data.zip .local/android/gradle-assets/engine-data.zip
          test -s .local/android/gradle-jni/arm64-v8a/libhorizon_android.so
          test -s .local/android/gradle-assets/engine-data.zip
      - name: Build debug APK
        run: gradle -p packaging/android assembleDebug -Pabi=arm64-v8a --stacktrace
      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find . -type f -path '*/outputs/apk/debug/*.apk' -print | sort)
          if [[ ${#APKS[@]} -ne 1 ]]; then
            printf 'Expected exactly one debug APK, found %s:\n' "${#APKS[@]}" >&2
            printf '  %s\n' "${APKS[@]:-<none>}" >&2
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Verifying $APK"
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZipFile
          apk = sys.argv[1]
          with ZipFile(apk) as z:
              names = set(z.namelist())
          required = {
              'lib/arm64-v8a/libhorizon_android.so',
              'assets/engine-data.zip',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'APK missing: {missing}')
          forbidden = [n for n in names if n.startswith('assets/minecraft/') or n.endswith('/client.jar')]
          if forbidden:
              raise SystemExit(f'APK unexpectedly bundles Minecraft-owned files: {forbidden[:5]}')
          print(f'APK verified: {apk} ({len(names)} ZIP entries)')
          PY
          cp "$APK" horizon-clean-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-clean-arm64-debug-apk
          path: horizon-clean-arm64-debug.apk
          if-no-files-found: error
