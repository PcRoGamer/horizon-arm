[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
# Preserve upstream winit call sites. The shim is an exact re-export on desktop
# and adds Android's missing modifier-supplement fallback only on Android.
winit = { package = "horizon-winit", path = "../horizon-winit" }
# The window icon.
horizon-theme = { path = "../horizon-theme" }
png = "0.18"
# Thin compatibility crate: re-exports arboard unchanged on desktop and supplies
# the Android backend that upstream arboard intentionally does not implement.
arboard = { package = "horizon-clipboard", path = "../horizon-clipboard" }
# The DualSense's trigger effects (the `controllers` feature).
horizon-dualsense = { path = "../horizon-dualsense", optional = true }

[features]
controllers = ["dep:horizon-dualsense"]

[lints]
workspace = true
