[package]
name = "horizon-clipboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Platform clipboard shim: stock arboard on desktop, Android bridge on Android"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard-real = { package = "arboard", version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[lints]
workspace = true
