plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.horizon.android'
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName '0.5.1'
        ndk { abiFilters providers.gradleProperty('abi').get() }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.development } }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets']
        res.srcDirs = ['res']
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
}
layout.buildDirectory = file('../../.local/android/gradle-build')
