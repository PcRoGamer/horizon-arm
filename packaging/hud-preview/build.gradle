plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.hudpreview'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.horizon.hudpreview'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets.main {
        manifest.srcFile 'src/main/AndroidManifest.xml'
        java.srcDirs = ['src/main/java', 'build/generated/horizon/java']
    }
}
def productionJava = file('../android/java/dev/horizon/android/HorizonActivity.java')
def extractedOverlay = file('build/generated/horizon/java/dev/horizon/hudpreview/HudPreviewOverlay.java')
tasks.register('generateProductionOverlay', Exec) {
    inputs.file(productionJava)
    outputs.file(extractedOverlay)
    def python = System.getenv('HORIZON_PYTHON') ?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python, '../../tools/extract_horizon_overlay.py', '--source',
        productionJava.absolutePath, '--output', extractedOverlay.absolutePath
}
tasks.named('preBuild') { dependsOn 'generateProductionOverlay' }


dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
